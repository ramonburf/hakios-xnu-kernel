# devices/talkman/device.conf: the Microsoft Lumia 950 (RM-1104, "talkman"), Snapdragon 808 (MSM8992).
# Started from its own UEFI (Lumia950XLPkg, chainloaded by Windows Phone's boot manager through BootShim), which runs
# xnuloader from the EFI system partition with the payload beside it (docs/uefi-boot.md, "a file of the volume").

device talkman
	title       Microsoft Lumia 950
	vendor      Microsoft
	soc         msm8992
	defconfig   talkman_defconfig
	maintainer  ramonburf
	status      display     partial   the UEFI framebuffer (1080x1920 at 0x400000); the iPhone X's 1125x2436 is cropped
	status      touch       missing   Synaptics RMI4 at 0x4b on BLSP1 QUP1, as on the 950 XL (UniXNU's NativeTouch)
	status      buttons     missing   PM8994 PON and GPIO keys
	status      storage     partial   eMMC through the loader and UEFI's block I/O (ufs=2), read only
	status      audio       missing
	status      network     missing
	status      gpu         missing   Adreno 418 (a4xx): hakios-metal is a6xx only
