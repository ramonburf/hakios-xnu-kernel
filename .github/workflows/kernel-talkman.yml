# The Lumia 950 (talkman, MSM8992) kernel: HakiOS's XNU with the GICv2 driver and no PAN (ARMv8.0 cores).
# A macOS runner, so nobody needs a Mac: xnu/apply.sh fetches Apple's xnu-8796.121.2, xnu-deps/setup.sh links
# Xcode's cctools and fetches the iPhoneOS 16.5 SDK, tools/make-kernel.sh builds and judges the result.
name: kernel-talkman

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runner label (macos-latest is arm64; its queue was hours long on 2 November)'
        default: 'macos-15-intel'
  push:
    branches: [talkman]
    paths:
      - 'xnu/**'
      - 'drivers/**'
      - 'xnu-deps/**'
      - 'xnu-build.sh'
      - 'xnu-env.sh'
      - 'tools/make-kernel.sh'
      - 'tools/hakios-config.py'
      - 'configs/**'
      - 'devices/talkman/**'
      - '.github/workflows/kernel-talkman.yml'
      - 'userland/src/init.c'
      - 'userland/libmini/**'

permissions:
  contents: read

concurrency:
  group: kernel-talkman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      HAKIOS_GIC: v2
      HAKIOS_CPU: v8.0
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          brew install autoconf automake flex bison lz4 xz
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          xcode-select -p; clang --version | head -1; python3 --version

      - name: Apple's XNU with HakiOS's patch
        run: xnu/apply.sh

      - name: Dependencies and SDK
        run: xnu-deps/setup.sh

      - name: The Lumia 950's configuration (no other phone's drivers)
        run: |
          python3 tools/hakios-config.py defconfig talkman_defconfig
          python3 tools/hakios-config.py check
          grep -E '^CONFIG_(HAKIOS_|DEVICE|UFS)' .config

      - name: Build the kernel (GICv2, ARMv8.0)
        run: |
          set -o pipefail
          KERNEL_LOG=xnu-build.log tools/make-kernel.sh -j"$(sysctl -n hw.ncpu)"

      - name: First errors, if any
        if: failure()
        run: |
          grep -nE "error:|\*\*\* " xnu-build.log | head -60 || true

      - name: Check the 950 choices made it in
        run: |
          file hakios-kernel
          strings hakios-kernel | grep -m3 -i "gic" || true
          shasum -a 256 hakios-kernel

      # init and its two helpers, as userland/build.sh compiles them: prebuilt/userland's are from 25 October and know
      # nothing of the data volume (var_hfs=), so the 950's /private/var stayed a memory filesystem
      - name: init, child, stage0 (static, userland/src)
        run: |
          source xnu-env.sh
          cd userland
          mkdir -p obj
          CC="xnu-clang -arch arm64 -Os -static -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra"
          LD="-Wl,-e,_start -Wl,-pagezero_size,0x100000000"
          $CC -Ilibmini -c libmini/mini.c -o obj/mini.o
          $CC -c libmini/start.S -o obj/start.o
          for prog in init child stage0; do
            $CC -Ilibmini $LD -o obj/$prog src/$prog.c obj/mini.o obj/start.o
          done
          file obj/init obj/child obj/stage0
          strings obj/init | grep -c var_hfs

      - uses: actions/upload-artifact@v4
        with:
          name: hakios-userland-static-talkman
          path: |
            userland/obj/init
            userland/obj/child
            userland/obj/stage0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hakios-kernel-talkman
          path: |
            hakios-kernel
            xnu-build.log
          if-no-files-found: warn
